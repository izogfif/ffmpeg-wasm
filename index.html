<!DOCTYPE html>
<html>
<head>
  <title>FFmpeg WASM</title>
  <style>
    body { font-family: sans-serif; max-width: 800px; margin: 2em auto; padding: 0 1em; }
    #output { white-space: pre-wrap; font-family: monospace; background: #f4f4f4; padding: 1em; min-height: 200px; max-height: 400px; overflow-y: auto; }
  </style>
</head>
<body>
  <h1>FFmpeg WASM</h1>
  <input type="file" id="fileInput" accept="video/*,audio/*,image/*" />
  <div id="output">Select a media file...</div>

  <script src="./wasm/ffmpeg-gpl.js"></script>
  <script>
    const output = document.getElementById('output');
    let ffmpeg;
    let outputData = '';

    function writeStr(ffmpeg, str, ptr) {
      for (let i = 0; i < str.length; i++) {
        const offset = ptr + i;
        const wordOffset = offset >> 2;
        const byteOffset = offset & 3;
        let word = ffmpeg.HEAPU32[wordOffset];
        word = (word & ~(0xFF << (byteOffset * 8))) | (str.charCodeAt(i) << (byteOffset * 8));
        ffmpeg.HEAPU32[wordOffset] = word;
      }
      ffmpeg.HEAPU32[(ptr + str.length) >> 2] &= ~(0xFF << ((ptr + str.length) & 3) * 8);
    }

    async function loadFFmpeg() {
      output.textContent = 'Loading FFmpeg...';
      outputData = '';
      ffmpeg = await createFFmpeg({
        locateFile: (file) => './wasm/' + file,
        print: (text) => {
          outputData += text + '\n';
        },
        printErr: (text) => {
          outputData += text + '\n';
        }
      });

      if (!ffmpeg._main) {
        throw new Error('ffmpeg._main not found');
      }

      ffmpeg._callMain = function(args) {
        const prog = 'ffmpeg';
        const argc = args.length + 1;
        const argvPtr = ffmpeg.___libc_malloc((argc + 1) * 4);
        const argvBase = argvPtr >> 2;

        for (let i = 0; i < argc; i++) {
          const s = i === 0 ? prog : args[i - 1];
          const ptr = ffmpeg.___libc_malloc(s.length + 1);
          writeStr(ffmpeg, s, ptr);
          ffmpeg.HEAPU32[argvBase + i] = ptr;
        }
        ffmpeg.HEAPU32[argvBase + argc] = 0;

        return ffmpeg._main(argc, argvPtr);
      };

      ffmpeg.callMain = function(args) {
        return ffmpeg._callMain(args);
      };

      output.textContent = 'FFmpeg ready. Select a file.';
    }

    loadFFmpeg().catch(err => {
      output.textContent = 'Error loading FFmpeg: ' + err.message;
    });

    document.getElementById('fileInput').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file || !ffmpeg) return;

      outputData = '';
      output.textContent = 'Loading ' + file.name + '...\n';

      ffmpeg.FS.mount(ffmpeg.WORKERFS, { files: [file] }, '/');
      output.textContent += 'Running ffmpeg -hide_banner -i ' + file.name + '...\n';

      const exitCode = ffmpeg.callMain(['-hide_banner', '-i', file.name]);
      console.log('callMain returned:', exitCode);

      output.textContent = outputData;
    });
  </script>
</body>
</html>
